<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAEDE — Set Environment</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-full bg-kaede-surface p-4 font-sans antialiased flex flex-col">
  <div class="flex-1">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-semibold text-kaede-text">Set Environment</h2>
      <span class="flex items-center justify-center size-5 rounded bg-kaede-primary text-white text-[8px] font-bold">K</span>
    </div>

    <div id="enforcement-alert" class="hidden mb-3 px-3 py-2 rounded-md border text-xs leading-relaxed"></div>

    <button type="button" class="env-option w-full text-left px-3.5 py-2.5 mb-1.5 rounded-md border border-kaede-border bg-kaede-bg text-kaede-text text-sm cursor-pointer transition-[border-color,background] duration-200 hover:border-kaede-primary hover:bg-[rgba(108,92,231,0.08)]" data-env="production">
      <span class="font-medium">Production</span>
      <span class="block text-[11px] text-kaede-muted mt-0.5">Live / customer-facing</span>
    </button>
    <button type="button" class="env-option w-full text-left px-3.5 py-2.5 mb-1.5 rounded-md border border-kaede-border bg-kaede-bg text-kaede-text text-sm cursor-pointer transition-[border-color,background] duration-200 hover:border-kaede-primary hover:bg-[rgba(108,92,231,0.08)]" data-env="staging">
      <span class="font-medium">Staging</span>
      <span class="block text-[11px] text-kaede-muted mt-0.5">Pre-production testing</span>
    </button>
    <button type="button" class="env-option w-full text-left px-3.5 py-2.5 mb-1.5 rounded-md border border-kaede-border bg-kaede-bg text-kaede-text text-sm cursor-pointer transition-[border-color,background] duration-200 hover:border-kaede-primary hover:bg-[rgba(108,92,231,0.08)]" data-env="development">
      <span class="font-medium">Development</span>
      <span class="block text-[11px] text-kaede-muted mt-0.5">Active development branch</span>
    </button>
  </div>

  <div class="pt-3 border-t border-kaede-border/50 text-center">
    <a href="/" target="_blank" rel="noopener" class="text-[10px] text-kaede-muted hover:text-kaede-primary no-underline transition-colors">About KAEDE Ecosystem</a>
  </div>

  <script src="https://p.trellocdn.net/power-up.min.js"></script>
  <script src="js/mcp-client.js"></script>
  <script>
    TrelloPowerUp.initialize({'card-buttons': function(t) { return []; }});

    var ENV_LABEL_MAP = {
      production:  { name: 'Production',  color: 'red' },
      staging:     { name: 'Staging',     color: 'yellow' },
      development: { name: 'Development', color: 'green' },
    };

    var alertEl = document.getElementById('enforcement-alert');

    function showEnforcement(warnings) {
      if (!warnings || warnings.length === 0) {
        alertEl.classList.add('hidden');
        return;
      }
      alertEl.classList.remove('hidden');
      alertEl.style.borderColor = warnings.some(function (w) { return w.severity === 'error'; })
        ? 'rgba(225,112,85,0.3)' : 'rgba(253,203,110,0.3)';
      alertEl.style.background = warnings.some(function (w) { return w.severity === 'error'; })
        ? 'rgba(225,112,85,0.08)' : 'rgba(253,203,110,0.08)';
      alertEl.innerHTML = '<div class="font-semibold text-kaede-text mb-1">Enforcement</div>' +
        warnings.map(function (w) {
          return '<div class="flex items-start gap-1.5 mt-1"><span class="shrink-0 ' +
            (w.severity === 'error' ? 'text-kaede-danger' : 'text-kaede-warning') +
            '">' + (w.severity === 'error' ? '!' : '\u26A0') + '</span>' +
            '<span class="text-kaede-muted">' + w.message + '</span></div>';
        }).join('');
    }

    function runEnforcement(env, cardId, t) {
      KAEDEMCP.init(t).then(function () {
        return Promise.all([
          KAEDEMCP.getAuth(t),
          t.get('board', 'shared', 'playbook', null),
        ]);
      }).then(function (results) {
        var auth = results[0];
        var playbook = results[1];
        if (!playbook) return;

        var plan = [{
          action: 'update_card',
          params: { cardId: cardId, name: env },
          description: 'Set environment to ' + env,
        }];
        return KAEDEMCP.enforcePlaybook(playbook, plan, []).then(function (result) {
          if (result && result.warnings && result.warnings.length > 0) {
            showEnforcement(result.warnings);
          }
          if (auth) syncLabelViaTrelloApi(cardId, env, auth);
        });
      }).catch(function () {
        /* enforcement skipped */
      });
    }

    function getTrelloAuth(t) {
      return t.get('board', 'shared', 'trelloAuth', null);
    }

    function syncLabelViaTrelloApi(cardId, env, auth) {
      if (!auth || !auth.key || !auth.token) return;

      var qs = 'key=' + encodeURIComponent(auth.key) + '&token=' + encodeURIComponent(auth.token);
      var base = 'https://api.trello.com/1';

      function trelloApi(path, opts) {
        var url = base + path + (path.indexOf('?') > -1 ? '&' : '?') + qs;
        return fetch(url, {
          method: opts.method || 'GET',
          headers: { 'Content-Type': 'application/json' },
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        }).then(function (r) {
          if (!r.ok) return r.text().then(function (txt) { throw new Error(txt.slice(0, 200)); });
          return r.json();
        });
      }

      return trelloApi('/cards/' + cardId + '?fields=idBoard').then(function (card) {
        return trelloApi('/boards/' + card.idBoard + '/labels?fields=id,name,color').then(function (labels) {
          var targetLabel = labels.find(function (l) {
            return l.name === env || l.color === ENV_LABEL_MAP[env].color;
          });

          function ensureLabel() {
            if (targetLabel) return Promise.resolve(targetLabel);
            var lbl = ENV_LABEL_MAP[env];
            return trelloApi('/boards/' + card.idBoard + '/labels', {
              method: 'POST',
              body: { name: lbl.name, color: lbl.color },
            }).then(function (newLabel) {
              targetLabel = newLabel;
              return newLabel;
            });
          }

          return ensureLabel().then(function (label) {
            var otherEnvs = Object.keys(ENV_LABEL_MAP).filter(function (e) { return e !== env; });
            var labelNameToRemove = {};
            otherEnvs.forEach(function (e) {
              var lbl = labels.find(function (l) { return l.name === ENV_LABEL_MAP[e].name; });
              if (lbl) labelNameToRemove[lbl.id] = true;
            });

            var removePromises = Object.keys(labelNameToRemove).map(function (labelId) {
              return trelloApi('/cards/' + cardId + '/idLabels/' + labelId, { method: 'DELETE' })
                .catch(function () {});
            });

            return Promise.all(removePromises).then(function () {
              return trelloApi('/cards/' + cardId + '/idLabels', {
                method: 'POST',
                body: { value: label.id },
              }).catch(function () {});
            });
          });
        });
      });
    }

    document.querySelectorAll('.env-option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var env = this.getAttribute('data-env');
        var t = TrelloPowerUp.iframe();
        var cardId = '';

        t.card('id')
          .then(function (card) {
            cardId = card.id;
            return Promise.all([
              t.get('card', 'shared', 'environment', null),
              t.get('board', 'shared', 'envStats', {}),
            ]);
          })
          .then(function (results) {
            var oldEnv = results[0];
            var stats = results[1];

            if (oldEnv === env) {
              t.closePopup();
              return;
            }

            if (oldEnv && stats[oldEnv] !== undefined) {
              stats[oldEnv] = Math.max(0, stats[oldEnv] - 1);
              if (stats[oldEnv] === 0) delete stats[oldEnv];
            }

            stats[env] = (stats[env] || 0) + 1;

            return Promise.all([
              t.set('card', 'shared', 'environment', env),
              t.set('board', 'shared', 'envStats', stats),
              runEnforcement(env, cardId, t),
            ]);
          })
          .then(function () {
            t.closePopup();
          })
          .catch(function (err) {
            console.error('[KAEDE] Failed to set environment:', err);
            t.closePopup();
          });
      });
    });
  </script>
</body>
</html>
