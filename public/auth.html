<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAEDE — Authorize</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="h-full bg-kaede-surface p-4 font-sans antialiased flex flex-col text-center">
    <div class="flex-1 flex flex-col items-center justify-center">
      <div class="flex items-center justify-center size-10 rounded-lg bg-kaede-primary/20 text-kaede-primary mb-3">
        <span class="text-sm font-bold">K</span>
      </div>
      <div id="auth-unauthorized">
        <h2 class="text-base font-semibold text-kaede-text mb-2">Authorize KAEDE</h2>
        <p class="text-sm text-kaede-muted leading-relaxed mb-4">
          Enter your Trello API credentials and MCP server URL to enable environment &rarr; label sync and MCP orchestration.
        </p>
        <div class="text-left bg-kaede-bg rounded-md p-3 mb-4 border border-kaede-border/50 text-[11px]">
          <div class="mb-3">
            <label class="text-kaede-text font-medium text-xs">API Key</label>
            <input type="text" id="auth-api-key" placeholder="Your Trello API Key"
              class="w-full mt-1 px-2 py-1.5 rounded border border-kaede-border bg-kaede-surface text-kaede-text text-xs outline-none focus:border-kaede-primary" />
          </div>
          <div class="mb-3">
            <label class="text-kaede-text font-medium text-xs">Token</label>
            <input type="password" id="auth-token" placeholder="Your Trello Token"
              class="w-full mt-1 px-2 py-1.5 rounded border border-kaede-border bg-kaede-surface text-kaede-text text-xs outline-none focus:border-kaede-primary" />
          </div>
          <div class="mb-3">
            <label class="text-kaede-text font-medium text-xs">MCP Server URL</label>
            <input type="text" id="auth-api-base" placeholder="http://localhost:3456"
              class="w-full mt-1 px-2 py-1.5 rounded border border-kaede-border bg-kaede-surface text-kaede-text text-xs outline-none focus:border-kaede-primary" />
          </div>
          <p class="text-kaede-muted leading-relaxed">
            Don't have Trello credentials?
            <a href="https://trello.com/power-ups/admin" target="_blank" rel="noopener"
              class="text-kaede-primary no-underline hover:underline">Get them here</a>.
          </p>
        </div>
        <button type="button" id="kaede-auth-btn"
          class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border-none bg-kaede-primary text-white text-sm font-medium cursor-pointer transition-colors duration-200 hover:bg-kaede-primary-hover">
          Authorize Board
        </button>
        <p id="auth-error" class="hidden text-kaede-danger text-[11px] mt-2"></p>
      </div>
      <div id="auth-authorized" class="hidden">
        <div class="flex items-center justify-center size-10 rounded-full bg-kaede-success/20 text-kaede-success mb-3">
          <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2 class="text-base font-semibold text-kaede-text mb-2">Board Authorized</h2>
        <p class="text-sm text-kaede-muted mb-4">This board is ready for KAEDE MCP orchestration.</p>
        <button
          type="button"
          id="kaede-deauth-btn"
          class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg border border-kaede-danger/50 text-kaede-danger text-sm font-medium bg-transparent cursor-pointer transition-colors duration-200 hover:bg-kaede-danger/10"
        >
          Remove Authorization
        </button>
      </div>
    </div>

    <div class="pt-3 border-t border-kaede-border/50 text-center">
      <a
        href="/"
        target="_blank"
        rel="noopener"
        class="text-[10px] text-kaede-muted hover:text-kaede-primary no-underline transition-colors"
        >About KAEDE Ecosystem</a
      >
    </div>

    <script src="https://p.trellocdn.net/power-up.min.js"></script>
    <script>
      (function () {
        var t = TrelloPowerUp.iframe();

        var unauthSection = document.getElementById('auth-unauthorized');
        var authSection = document.getElementById('auth-authorized');

        function checkAuth() {
          t.get('board', 'shared', 'auth', null)
            .then(function (auth) {
              if (auth && auth.connected) {
                unauthSection.classList.add('hidden');
                authSection.classList.remove('hidden');
              }
            })
            .catch(function () {});
        }

        checkAuth();

        document.getElementById('auth-api-base').value = 'http://localhost:3456';

        document.getElementById('kaede-auth-btn').addEventListener('click', function () {
          var apiKey = document.getElementById('auth-api-key').value.trim();
          var token = document.getElementById('auth-token').value.trim();
          var apiBase = document.getElementById('auth-api-base').value.trim();
          var errEl = document.getElementById('auth-error');

          if (!apiKey || !token) {
            errEl.textContent = 'API Key and Token are required.';
            errEl.classList.remove('hidden');
            return;
          }

          if (!apiBase) {
            errEl.textContent = 'MCP Server URL is required.';
            errEl.classList.remove('hidden');
            return;
          }

          errEl.classList.add('hidden');

          Promise.all([
            t.set('board', 'shared', 'auth', { connected: true, provider: 'kaede-mcp', version: '1.0.0' }),
            t.set('board', 'shared', 'trelloAuth', { key: apiKey, token: token }),
            t.set('board', 'shared', 'apiBase', apiBase.replace(/\/+$/, '')),
          ])
            .then(function () {
              unauthSection.classList.add('hidden');
              authSection.classList.remove('hidden');
            })
            .catch(function (err) {
              console.error('[KAEDE] Auth failed:', err);
              errEl.textContent = 'Failed to save: ' + err.message;
              errEl.classList.remove('hidden');
            });
        });

        document.getElementById('kaede-deauth-btn').addEventListener('click', function () {
          Promise.all([
            t.set('board', 'shared', 'auth', null),
            t.set('board', 'shared', 'trelloAuth', null),
            t.set('board', 'shared', 'apiBase', null),
          ])
            .then(function () {
              document.getElementById('auth-api-key').value = '';
              document.getElementById('auth-token').value = '';
              document.getElementById('auth-api-base').value = 'http://localhost:3456';
              authSection.classList.add('hidden');
              unauthSection.classList.remove('hidden');
            })
            .catch(function (err) {
              console.error('[KAEDE] Deauth failed:', err);
            });
        });
      })();
    </script>
  </body>
</html>
