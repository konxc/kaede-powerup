name: Build & Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web assets (Tailwind CSS via Vite)
        run: bun run build:static

      - name: Build static docs (Markdown → HTML)
        run: bun run --filter @kaede/docs build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/docs/dist
          publish_branch: gh-pages
          full_commit_message: 'docs: auto-build from ${{ github.sha }}'
